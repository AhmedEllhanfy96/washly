events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  # ── Shared SSL settings ────────────────────────────────────────────────────
  ssl_certificate     /etc/letsencrypt/live/washly.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/washly.duckdns.org/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # ── HTTP → HTTPS redirect (also serves Let's Encrypt ACME challenge) ───────
  server {
    listen 80;
    server_name washly.duckdns.org;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── Customer app — https://washly.duckdns.org ─────────────────────────────
  server {
    listen 443 ssl;
    server_name washly.duckdns.org;

    # WebSocket via /api/ws (Flutter derives ws URL as API_URL + /ws)
    location /api/ws {
      rewrite ^/api(/ws)$ $1 break;
      proxy_pass         http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 3600s;
    }

    # WebSocket direct path (backward compat)
    location /ws {
      proxy_pass         http://backend:3000/ws;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 3600s;
    }

    # Backend REST API — strip /api prefix before forwarding
    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass         http://backend:3000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Customer Flutter web app
    location / {
      proxy_pass         http://customer-app:80;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }
  }

  # ── Admin app — https://washly.duckdns.org:8081 ───────────────────────────
  server {
    listen 8081 ssl;
    server_name washly.duckdns.org;

    location / {
      proxy_pass       http://admin-app:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # ── Worker app — https://washly.duckdns.org:8082 ──────────────────────────
  server {
    listen 8082 ssl;
    server_name washly.duckdns.org;

    location / {
      proxy_pass       http://worker-app:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
