name: washly_worker
description: Washly — Worker app for car wash team members.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP + WebSocket
  dio: ^5.4.3
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.1.4

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # External links
  url_launcher: ^6.3.0

  # UI
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
