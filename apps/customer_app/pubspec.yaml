name: washly_customer
description: Washly — On-demand car washing service for customers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.3
  firebase_storage: ^12.1.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.1.4

  # Location & Maps
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # UI helpers
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Storage
  shared_preferences: ^2.2.3

  # Utils
  uuid: ^4.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
