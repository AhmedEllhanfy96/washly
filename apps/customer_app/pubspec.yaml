name: washly_customer
description: Washly — On-demand car washing service for customers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP + WebSocket
  dio: ^5.4.3
  web_socket_channel: ^3.0.1
  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.1.4

  # Location & Maps
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI helpers
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Links & phone
  url_launcher: ^6.2.6

  # Utils
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
