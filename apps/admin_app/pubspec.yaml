name: washly_admin
description: Washly — Admin & team management app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP + WebSocket
  dio: ^5.4.3
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.2.3

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.1.4

  # UI helpers
  intl: ^0.20.2
  shimmer: ^3.0.0

  # Map + location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # External links
  url_launcher: ^6.3.0

  # Utils
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
