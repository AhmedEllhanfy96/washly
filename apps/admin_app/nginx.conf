server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Flutter fingerprinted assets — safe to cache forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Images and fonts with stable names
  location ~* \.(png|jpg|jpeg|svg|ico|ttf|otf|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything else (HTML, JS, WASM) — always fetch fresh
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm;
}
