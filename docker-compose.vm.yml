# Standalone deploy file for the remote VM.
# No repo clone required — copy this file + a .env file to the VM and run:
#
#   docker compose -f docker-compose.vm.yml pull
#   docker compose -f docker-compose.vm.yml up -d
#
# Required .env keys: DB_PASSWORD, JWT_SECRET
# Images are always pulled fresh from the registry on every `up`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: washly
      POSTGRES_USER: washly
      POSTGRES_PASSWORD: ${DB_PASSWORD:-washly_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U washly"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  init-db:
    image: postgres:16-alpine
    pull_policy: missing
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-washly_secret}
    command:
      - sh
      - -c
      - |
        psql -h postgres -U washly -d washly <<'SQL'
        CREATE EXTENSION IF NOT EXISTS "pgcrypto";
        CREATE TABLE IF NOT EXISTS users (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          email TEXT UNIQUE NOT NULL,
          password_hash TEXT NOT NULL,
          name TEXT NOT NULL DEFAULT '',
          phone TEXT NOT NULL DEFAULT '',
          role TEXT NOT NULL DEFAULT 'customer',
          created_at TIMESTAMPTZ DEFAULT NOW()
        );
        CREATE TABLE IF NOT EXISTS bookings (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          user_id UUID REFERENCES users(id) ON DELETE CASCADE,
          customer_name TEXT NOT NULL DEFAULT '',
          customer_phone TEXT NOT NULL DEFAULT '',
          car JSONB NOT NULL DEFAULT '{}',
          service_type TEXT NOT NULL DEFAULT 'exterior_only',
          address TEXT NOT NULL DEFAULT '',
          latitude DOUBLE PRECISION DEFAULT 0,
          longitude DOUBLE PRECISION DEFAULT 0,
          scheduled_at TIMESTAMPTZ NOT NULL,
          time_slot TEXT NOT NULL DEFAULT '',
          status TEXT NOT NULL DEFAULT 'pending',
          assigned_to TEXT,
          notes TEXT DEFAULT '',
          source TEXT NOT NULL DEFAULT 'app',
          created_at TIMESTAMPTZ DEFAULT NOW(),
          updated_at TIMESTAMPTZ DEFAULT NOW()
        );
        ALTER TABLE bookings ADD COLUMN IF NOT EXISTS source TEXT NOT NULL DEFAULT 'app';
        CREATE TABLE IF NOT EXISTS saved_cars (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
          make TEXT NOT NULL,
          model TEXT NOT NULL,
          color TEXT NOT NULL,
          plate_number TEXT NOT NULL,
          year TEXT,
          created_at TIMESTAMPTZ DEFAULT NOW()
        );
        CREATE TABLE IF NOT EXISTS saved_locations (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
          label TEXT NOT NULL DEFAULT 'Home',
          address TEXT NOT NULL,
          latitude DOUBLE PRECISION NOT NULL DEFAULT 0,
          longitude DOUBLE PRECISION NOT NULL DEFAULT 0,
          created_at TIMESTAMPTZ DEFAULT NOW()
        );
        CREATE TABLE IF NOT EXISTS team_members (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          name TEXT NOT NULL,
          phone TEXT NOT NULL DEFAULT '',
          is_available BOOLEAN DEFAULT TRUE,
          created_at TIMESTAMPTZ DEFAULT NOW()
        );
        CREATE OR REPLACE FUNCTION update_updated_at()
        RETURNS TRIGGER AS \$\$
        BEGIN NEW.updated_at = NOW(); RETURN NEW; END;
        \$\$ LANGUAGE plpgsql;
        DROP TRIGGER IF EXISTS bookings_updated_at ON bookings;
        CREATE TRIGGER bookings_updated_at
          BEFORE UPDATE ON bookings
          FOR EACH ROW EXECUTE FUNCTION update_updated_at();
        INSERT INTO users (email, password_hash, name, role)
        VALUES ('admin@washly.com', crypt('admin123', gen_salt('bf')), 'Admin', 'admin')
        ON CONFLICT (email) DO NOTHING;
        SQL
    restart: "no"

  backend:
    image: ghcr.io/ahmedellhanfy96/washly/backend:latest
    pull_policy: always
    environment:
      DATABASE_URL: postgres://washly:${DB_PASSWORD:-washly_secret}@postgres:5432/washly
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

  customer-app:
    image: ghcr.io/ahmedellhanfy96/washly/customer-app:latest
    pull_policy: always
    ports:
      - "80:80"
    restart: unless-stopped

  admin-app:
    image: ghcr.io/ahmedellhanfy96/washly/admin-app:latest
    pull_policy: always
    ports:
      - "8081:80"
    restart: unless-stopped

  worker-app:
    image: ghcr.io/ahmedellhanfy96/washly/worker-app:latest
    pull_policy: always
    ports:
      - "8082:80"
    restart: unless-stopped

volumes:
  postgres_data:
