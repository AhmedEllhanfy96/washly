services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: washly
      POSTGRES_USER: washly
      POSTGRES_PASSWORD: ${DB_PASSWORD:-washly_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U washly"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://washly:${DB_PASSWORD:-washly_secret}@postgres:5432/washly
      JWT_SECRET: ${JWT_SECRET:-washly-dev-secret-change-in-prod}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  customer-app:
    build:
      context: ./apps/customer_app
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:3000}
        WS_URL: ${WS_URL:-ws://localhost:3000/ws}
    ports:
      - "80:80"
    restart: unless-stopped

  admin-app:
    build:
      context: ./apps/admin_app
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:3000}
        WS_URL: ${WS_URL:-ws://localhost:3000/ws}
    ports:
      - "8081:80"
    restart: unless-stopped

  worker-app:
    build:
      context: ./apps/worker_app
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:3000}
        WS_URL: ${WS_URL:-ws://localhost:3000/ws}
    ports:
      - "8082:80"
    restart: unless-stopped

volumes:
  postgres_data:
